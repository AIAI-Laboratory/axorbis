<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Axorbis — literature intelligence</title>
  <desc id="description">A red and cream banner illustrating papers moving through screening, evidence mapping, and a literature review.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e9e4db" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f2f0e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#fade)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity=".55"/>
  <path d="M0 0h1200v6H0z" fill="#ff3b30"/>
  <path d="M50 64h40" stroke="#ff3b30" stroke-width="5" stroke-linecap="round"/>
  <text x="50" y="124" fill="#181818" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-4">Axorbis</text>
  <text x="52" y="164" fill="#a7342f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">LITERATURE INTELLIGENCE</text>
  <text x="52" y="216" fill="#41413f" font-family="Arial, Helvetica, sans-serif" font-size="21">From a research question to traceable evidence.</text>
  <text x="52" y="258" fill="#6f706c" font-family="Arial, Helvetica, sans-serif" font-size="15">SEARCH  /  SCREEN  /  MAP  /  VERIFY</text>
  <path d="M680 157h455" fill="none" stroke="#d4d4cc" stroke-width="3" stroke-dasharray="6 8"/>
  <circle cx="730" cy="157" r="49" fill="#fff" stroke="#d8d8d0" stroke-width="2"/>
  <path d="M709 127h31l11 11v45h-42z" fill="#faf9f6" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <path d="M740 127v11h11M718 149h24M718 158h24M718 167h16" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="912" cy="157" r="49" fill="#fff" stroke="#d8d8d0" stroke-width="2"/>
  <circle cx="904" cy="153" r="17" fill="none" stroke="#222" stroke-width="3"/>
  <path d="m916 166 15 15m-34-28 5 5 10-11" fill="none" stroke="#ff3b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1094" cy="157" r="49" fill="#ff3b30"/>
  <path d="M1075 138h38v39h-38z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M1083 149h22m-22 8h22m-22 8h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="730" y="231" fill="#5d5d59" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PAPERS</text>
  <text x="912" y="231" fill="#5d5d59" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EVIDENCE</text>
  <text x="1094" y="231" fill="#a7342f" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">REVIEW</text>
</svg>
